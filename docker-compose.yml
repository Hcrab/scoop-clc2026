services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: scoop
    ports:
      - "5432:5432"
    volumes:
      - scoop-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scoop"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  scoop-db:
